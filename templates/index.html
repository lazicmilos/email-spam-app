<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Classifier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-1: #ff6b6b;
            --bg-gradient-2: #4ecdc4;
            --bg-gradient-3: #45b7d1;
            --bg-gradient-4: #f7b731;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(255, 255, 255, 0.3);
            --text-primary: #1a202c;
            --text-secondary: #718096;
            --input-border: #e2e8f0;
            --input-focus: #667eea;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body.dark-mode {
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --bg-gradient-3: #0f3460;
            --bg-gradient-4: #533483;
            --card-bg: rgba(30, 30, 45, 0.9);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --input-border: #4a5568;
            --input-focus: #805ad5;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg,
                    var(--bg-gradient-1) 0%,
                    var(--bg-gradient-2) 25%,
                    var(--bg-gradient-3) 50%,
                    var(--bg-gradient-4) 100%);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 50% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            75% {
                background-position: 50% 100%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        .theme-toggle:active {
            transform: scale(0.95) rotate(15deg);
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 650px;
            width: 100%;
            padding: 40px;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 32px;
            transition: color 0.3s ease;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 14px;
            background: var(--card-bg);
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-primary);
            resize: vertical;
            transition: all 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 50%, #45b7d1 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        body.dark-mode button {
            background: linear-gradient(135deg, #0f3460 0%, #533483 100%);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }

        body.dark-mode button:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(83, 52, 131, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .typing-indicator {
            display: none;
            gap: 4px;
        }

        button:disabled .typing-indicator {
            display: flex;
        }

        button:disabled .button-text {
            display: none;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        #result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 8px;
            font-size: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
        }

        #result.show {
            opacity: 1;
            transform: translateY(0);
        }

        #result strong {
            font-size: 20px;
            display: block;
            margin-bottom: 8px;
        }

        .confidence {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .confidence-bar {
            flex: 1;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: currentColor;
            border-radius: 4px;
            transition: width 0.6s ease-out;
        }

        .spam {
            background: #fed7d7;
            color: #c53030;
            border-left: 4px solid #fc8181;
        }

        .dark-mode .spam {
            background: rgba(254, 215, 215, 0.2);
            border-left: 4px solid #fc8181;
        }

        .not-spam {
            background: #c6f6d5;
            color: #2f855a;
            border-left: 4px solid #48bb78;
        }

        .dark-mode .not-spam {
            background: rgba(198, 246, 213, 0.2);
            border-left: 4px solid #48bb78;
        }

        .error {
            background: #fff5f5;
            color: #c53030;
            border-left: 4px solid #fc8181;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
        }

        .dark-mode .error {
            background: rgba(255, 245, 245, 0.2);
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="container">
        <h1>Email Spam Classifier</h1>
        <p class="subtitle">Paste an email below to analyze if it's spam or legitimate</p>

        <form id="classifyForm">
            <div class="input-group">
                <label for="emailText">Email Content</label>
                <textarea id="emailText" placeholder="Paste your email text here..." required></textarea>
            </div>
            <button type="submit" id="submitBtn">
                <div class="button-content">
                    <span class="button-text">Analyze Email</span>
                    <div class="typing-indicator">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            </button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById('classifyForm');
        const textarea = document.getElementById('emailText');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // Theme management
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeIcon.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = textarea.value.trim();
            if (!text) return;

            // UI feedback
            submitBtn.disabled = true;
            resultDiv.classList.remove('show');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) throw new Error('Classification failed');

                const data = await response.json();
                displayResult(data);

            } catch (error) {
                resultDiv.innerHTML = `<div class="error">⚠️ Error: ${error.message}</div>`;
                resultDiv.classList.add('show');
            } finally {
                submitBtn.disabled = false;
            }
        });

        function displayResult(data) {
            const isSpam = data.result === 'Spam';
            const spamPercent = (data.spam_probability * 100).toFixed(2);

            resultDiv.className = isSpam ? 'spam' : 'not-spam';
            resultDiv.innerHTML = `
                <strong>${isSpam ? '🚨 Spam Detected' : '✅ Legitimate Email'}</strong>
                <div class="confidence">
                    <span>Spam probability:</span>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${spamPercent}%"></div>
                    </div>
                    <span>${spamPercent}%</span>
                </div>
            `;

            // Trigger animation
            setTimeout(() => resultDiv.classList.add('show'), 10);
        }
    </script>
</body>

</html>
